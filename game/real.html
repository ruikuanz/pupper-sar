<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Controls: human left, Pupper right</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { overflow: hidden; }
    .strip { display: flex; gap: 12px; padding: 10px 12px; height: 100vh; box-sizing: border-box; align-items: stretch; }
    .strip .card { flex: 1 1 0; min-width: 0; display: flex; gap: 12px; }
    .strip .card > div { flex: 1 1 0; min-width: 0; overflow: hidden; }
    .strip .card > .media { flex: 0 0 42%; display: flex; align-items: center; justify-content: center; }
    /* As large as the strip's height and the card's share of its width allow. */
    .strip .webcam { width: min(100%, calc((100vh - 46px) * 4 / 3)); aspect-ratio: 4 / 3; margin: 0; }
    .strip #pupper-eye { width: min(100%, calc((100vh - 46px) * 16 / 9)); aspect-ratio: 16 / 9; margin: 0; }
    .strip .both { flex: 0 0 190px; flex-direction: column; justify-content: center; }
    .strip h2 { margin: 0 0 6px; }
    .strip #speed { width: 100%; margin: 4px 0 0; }
    .strip .detail { margin: 4px 0; }
    .strip button.on { outline: 2px solid #e5484d; }
  </style>
</head>
<body>
  <div class="strip">
    <div class="card">
      <div>
        <h2>Human &larr; left window</h2>
        <p id="pose-status" class="status">webcam off</p>
        <p class="detail">Click the left game and use <kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd>, or step, jump and squat in front of the webcam.</p>
        <div class="row">
          <button id="camera">Use webcam</button>
          <button id="calibrate" disabled>Calibrate</button>
          <button id="record" title="Save the pictures and keys of your runs, to teach Pupper (real/train.py)">Record my play</button>
        </div>
        <p id="record-status" class="detail"></p>
      </div>
      <div class="media">
        <div class="webcam">
          <video id="webcam" playsinline muted></video>
          <canvas id="skeleton"></canvas>
        </div>
      </div>
    </div>

    <div class="card both">
      <button id="start-runs" class="primary">Start both runs</button>
      <p id="runs-status" class="detail"></p>
      <label class="detail" for="speed">Game speed <b id="speed-value"></b></label>
      <input id="speed" type="range" min="0.15" max="1" step="0.05" value="0.35">
    </div>

    <div class="card" id="pupper-card">
      <div>
        <h2>Pupper &rarr; right window</h2>
        <p id="link-status" class="status">not connected</p>
        <p id="robot-status" class="detail">Start surfer/server.py --game real to let Pupper play.</p>
        <div class="row">
          <button id="play" class="primary" disabled>Let Pupper play</button>
          <button id="stop" disabled>Stop</button>
        </div>
        <div class="row">
          <button id="stand" disabled>Stand up</button>
          <button id="lie" disabled>Lie down</button>
        </div>
      </div>
      <div class="media">
        <img id="pupper-eye" alt="">
      </div>
    </div>
  </div>

  <script type="module" src="js/real_panel.js"></script>
</body>
</html>
